name: CI

# Runs on every push and PR to main.
# Checks: TypeScript, ESLint, Vitest, dynamic route conflicts, production build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    # Phase 5 fix: the five real-PostgreSQL integration suites
    # (checkout-real-postgres, app-webhook-integration, app-checkout-concurrency,
    # webhook-postgres-fk, migration-integrity) connect to 127.0.0.1:5433 and
    # previously failed with ECONNREFUSED because no database was provisioned.
    # Provision PostgreSQL 16 as a service container and migrate before tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: printshop_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/printshop_ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/printshop_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system dependencies for pipeline integration tests
        # The Razorpay PR's pipeline integration tests (in
        # src/lib/pipeline/pipeline.integration.test.ts + src/lib/orders/order-flow.integration.test.ts)
        # require three system binaries that aren't on the default Ubuntu runner:
        #   - pdftoppm (Poppler) — renders PDF pages to PNG thumbnails
        #   - gs (Ghostscript) — inkcov color detection (which pages are color)
        #   - libreoffice — DOCX → PDF normalization
        # Without these, 8 tests fail with `spawn pdftoppm ENOENT` etc.
        # The apt-get installs them in ~20s; the tests then pass.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ghostscript libreoffice-core libreoffice-writer
          echo "=== verify installs ==="
          which pdftoppm gs libreoffice

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Check dynamic route conflicts
        run: bash scripts/check-route-conflicts.sh

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: bun run lint

      - name: Apply database migrations (integration test database)
        run: bunx prisma migrate deploy

      - name: Unit tests
        run: bunx vitest run
