# PrintShop SaaS — CI (spec §12). Runs on every push + PR.
# Type check → Lint → Unit tests → Build. On merge to main, the deploy jobs
# (Vercel for web, Render hook for the API) fire from their own integrations.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Unit tests (pricing + repo + payments)
        run: bunx vitest run
      - name: Build
        run: bun run lint # placeholder; `next build` runs in the deploy step
        env:
          DATABASE_URL: "file:./ci.db"
          JWT_ACCESS_SECRET: ci-access
          JWT_REFRESH_SECRET: ci-refresh

  db-migrate:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Push schema (staging)
        run: bun run db:push
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      - name: Seed staging
        run: bun run scripts/seed.ts
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
